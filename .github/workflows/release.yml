name: Release Gate

# Final validation gate for tagged releases. Publishing is tag-based: the git tag IS
# the release. This workflow only guards the tag — it does not build or attach
# artifacts. Consumers install from the repo at the tag (e.g. `npx skills add`).

on:
  push:
    tags:
      - "v*"

env:
  SKILLS_DIR: skills
  SKILL_VALIDATOR_VERSION: v1.6.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@${{ env.SKILL_VALIDATOR_VERSION }}

      - name: Validate skills
        run: |
          skill-validator check --strict --emit-annotations -o markdown "$SKILLS_DIR" \
            | tee >(grep -v '^::' >> "${GITHUB_STEP_SUMMARY:-/dev/null}")
